# DStack CSV specific configurations
CONFIG_SEV_GUEST=y
CONFIG_AMD_MEM_ENCRYPT=y
CONFIG_AMD_MEM_ENCRYPT_ACTIVE_BY_DEFAULT=y
CONFIG_EFI_COCO_SECRET=y
CONFIG_VIRT_DRIVERS=y
CONFIG_VMGENID=y
CONFIG_EFI_SECRET=y

# Hygon CSV specific
CONFIG_HYGON_CSV=y
CONFIG_CRYPTO_DEV_CCP=y
CONFIG_HYMCCP=y
CONFIG_CRYPTO_DEV_HCT=m

# VFIO support
CONFIG_VFIO_MDEV=y
CONFIG_VFIO_MDEV_DEVICE=y
CONFIG_VFIO=y
CONFIG_VFIO_IOMMU_TYPE1=y
CONFIG_VFIO_PCI=y

# Network and storage
CONFIG_BLK_DEV_NBD=m
CONFIG_VIRTIO_BLK=y
CONFIG_VIRTIO_NET=y

# Memory management
CONFIG_CMA=y
CONFIG_HUGETLBFS=y
CONFIG_LIBCRC32C=y

# Disable unnecessary features
CONFIG_X86_CPU_RESCTRL=n
CONFIG_IO_STRICT_DEVMEM=n
CONFIG_DEBUG_INFO=n
CONFIG_SYSTEM_TRUSTED_KEYS=""
CONFIG_SYSTEM_REVOCATION_KEYS=""
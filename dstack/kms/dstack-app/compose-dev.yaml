services:
  auth-api:
    build:
      context: ../../..
      dockerfile_inline: |
        FROM node:18-alpine@sha256:06f7bbbcec00dd10c21a3a0962609600159601b5004d84aff142977b449168e9
        WORKDIR /app

        RUN sed -i 's/dl-cdn.alpinelinux.org/mirrors.tuna.tsinghua.edu.cn/g' /etc/apk/repositories && \
        apk add --no-cache git
        RUN git config --global http.proxy http://10.0.2.2:7890 && \
            git config --global https.proxy http://10.0.2.2:7890 && \
            git clone https://ghfast.top/github.com/djy0612/dstack.git && \
            cd dstack && \
            git checkout ${GIT_REV}
        WORKDIR /app/dstack/kms/auth-eth
        RUN npm config set registry https://registry.npmmirror.com/
        RUN npm install
        RUN npx tsc --project tsconfig.json
        CMD node dist/src/main.js
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ETH_RPC_URL=${ETH_RPC_URL}
      - KMS_CONTRACT_ADDR=${KMS_CONTRACT_ADDR}
    restart: unless-stopped
    ports:
      - 8001:8000

  kms:
    build:
      context: ../../..
      dockerfile_inline: |
        FROM golang:1.22-alpine@sha256:1699c10032ca2582ec89a24a1312d986a3f094aed3d5c1147b19880afe40e052 AS dstack-mr-builder
        WORKDIR /app
        RUN sed -i 's/dl-cdn.alpinelinux.org/mirrors.tuna.tsinghua.edu.cn/g' /etc/apk/repositories && \
        apk add --no-cache git

        RUN git config --global http.proxy http://10.0.2.2:7890 && \
            git config --global https.proxy http://10.0.2.2:7890 && \
            git clone https://ghfast.top/github.com/kvinwang/dstack-mr.git
        WORKDIR /app/dstack-mr
        RUN git checkout 5cf6d917e076f3624eab1b6b662f222ece15600f
        ENV GO111MODULE=on
        ENV GOPROXY=https://goproxy.cn,direct
        RUN CGO_ENABLED=0 go build -ldflags="-extldflags -static" -o /usr/local/bin/dstack-mr

        FROM rust:1.86.0@sha256:300ec56abce8cc9448ddea2172747d048ed902a3090e6b57babb2bf19f754081 AS kms-builder
        WORKDIR /app
        RUN rm -f /etc/apt/sources.list.d/* /etc/apt/sources.list && \
            echo "deb https://mirrors.tuna.tsinghua.edu.cn/debian bookworm main contrib non-free" > /etc/apt/sources.list && \
            echo "deb https://mirrors.tuna.tsinghua.edu.cn/debian bookworm-updates main contrib non-free" >> /etc/apt/sources.list && \
            echo "deb https://mirrors.tuna.tsinghua.edu.cn/debian-security bookworm-security main contrib non-free" >> /etc/apt/sources.list && \
            apt-get update && apt-get install -y \
            git \
            build-essential \
            musl-tools \
            libssl-dev \
            protobuf-compiler \
            libprotobuf-dev \
            clang \
            libclang-dev \
            --no-install-recommends \
            && rm -rf /var/lib/apt/lists/*
        # 设置 Rust 镜像和网络策略
        ENV CARGO_REGISTRIES_CRATES_IO_INDEX=https://mirrors.ustc.edu.cn/crates.io-index
        ENV CARGO_NET_GIT_FETCH_WITH_CLI=true
        ENV RUSTUP_DIST_SERVER=https://mirrors.ustc.edu.cn/rust-static
        ENV RUSTUP_UPDATE_ROOT=https://mirrors.ustc.edu.cn/rust-static/rustup
        RUN git config --global http.proxy http://10.0.2.2:7890 && \
            git config --global https.proxy http://10.0.2.2:7890 && \
            git clone https://ghfast.top/github.com/djy0612/gmssl.git /opt/gmssl

        RUN git config --global http.proxy http://10.0.2.2:7890 && \
            git config --global https.proxy http://10.0.2.2:7890 && \
            git clone https://ghfast.top/github.com/djy0612/dstack.git && \
            cd dstack && \
            git checkout ${GIT_REV}
        # 克隆 dstack 仓库后添加
        RUN git config --global url."https://ghfast.top/github.com/".insteadOf "https://github.com/"

        WORKDIR /app/dstack
        RUN mkdir -p ~/.cargo && \
            echo '[net]\ngit-fetch-with-cli = true\n' > ~/.cargo/config && \
            echo '[source.crates-io]\nreplace-with = "ustc"\n\n[source.ustc]\nregistry = "https://mirrors.ustc.edu.cn/crates.io-index"' >> ~/.cargo/config && \
            git config --global http.postBuffer 1048576000 && \
            git config --global http.maxRequestBuffer 100M && \
            git config --global core.compression 0 && \
            git config --global http.lowSpeedLimit 0 && \
            git config --global http.lowSpeedTime 999999 && \
            git config --global http.version HTTP/1.1
        
        ENV CARGO_HTTP_MULTIPLEXING=false
        ENV CARGO_HTTP_CHECK_REVOKE=false
        ENV CARGO_HTTP_TIMEOUT=300
        
        RUN cargo build --release -p dstack-kms --target x86_64-unknown-linux-gnu

        FROM debian:bookworm-slim
        COPY --from=kms-builder /app/dstack/target/x86_64-unknown-linux-gnu/release/dstack-kms /usr/local/bin/dstack-kms
        COPY --from=kms-builder /app/dstack/kms/dstack-app/entrypoint.sh /entrypoint.sh
        COPY --from=dstack-mr-builder /usr/local/bin/dstack-mr /usr/local/bin/dstack-mr
        WORKDIR /app/kms
        CMD ["/entrypoint.sh"]
    volumes:
      - kms-volume:/etc/kms
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      - IMAGE_DOWNLOAD_URL=${IMAGE_DOWNLOAD_URL}
      - ADMIN_TOKEN_HASH=${ADMIN_TOKEN_HASH}
    ports:
      - 8000:8000
    depends_on:
      - auth-api
    restart: unless-stopped

volumes:
  kms-volume:

# Hygon CSV specific configurations
CONFIG_HYGON_CSV=y

# Hygon crypto coprocessor support
CONFIG_CRYPTO_DEV_CCP=y
CONFIG_HYMCCP=y
CONFIG_CRYPTO_DEV_HCT=m

# VFIO support for device passthrough
CONFIG_VFIO_MDEV=y
CONFIG_VFIO_MDEV_DEVICE=y
CONFIG_VFIO=y
CONFIG_VFIO_IOMMU_TYPE1=y
CONFIG_VFIO_PCI=y

# Network block device support
CONFIG_BLK_DEV_NBD=m

# Control groups support
CONFIG_CGROUPS=y
CONFIG_CGROUP_CPUACCT=y

# Xen PV support
CONFIG_XEN_PV=y

# Contiguous Memory Allocator
CONFIG_CMA=y

# HugeTLB filesystem support
CONFIG_HUGETLBFS=y

# CRC32 library
CONFIG_LIBCRC32C=y

# Disable x86 CPU resource control
CONFIG_X86_CPU_RESCTRL=n

# VirtIO support
CONFIG_VIRTIO_BLK=y
CONFIG_VIRTIO_NET=y

# Disable strict devmem access
CONFIG_IO_STRICT_DEVMEM=n

# Disable debug info for smaller kernel
CONFIG_DEBUG_INFO=n

# Disable system trusted keys
CONFIG_SYSTEM_TRUSTED_KEYS=""
CONFIG_SYSTEM_REVOCATION_KEYS=""
